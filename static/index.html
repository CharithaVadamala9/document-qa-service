<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>docqa — document question answering</title>
<style>
  /* Light theme only, by design: a single deliberate palette rather than two
     half-tuned ones. Sizing is fluid so the card grows with the viewport. */
  :root {
    --page: #f4f6fa;
    --card: #ffffff;
    --fg: #14161a;
    --muted: #6b7280;
    --faint: #9aa2af;
    --line: #e6e9ee;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --accent-soft: #eef4ff;
    --dash: #a9c2f7;
    --ok: #15803d;
    --ok-soft: #e7f6ec;
    --warn: #a16207;
    --warn-soft: #fdf4e0;
    --err: #b91c1c;
    --err-soft: #fdeceb;
    --pdf: #dc2626;
    --json: #2563eb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 18px 44px rgba(16, 24, 40, .10);

    --pad-y: clamp(1.25rem, 3.5vh, 3rem);
    --pad-x: clamp(1rem, 4vw, 3rem);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--pad-y) var(--pad-x);
    min-height: 100vh;
    display: flex;
    background: var(--page);
    color: var(--fg);
    font: clamp(15px, 1.05vw, 17px)/1.55 ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* margin:auto on a flex child centres on both axes. Once results exist the
     page is taller than the viewport, so it pins to the top instead. */
  main { margin: auto; width: 100%; max-width: min(100%, 86rem); }
  body.has-results main { margin: 0 auto; }

  header { margin-bottom: clamp(1rem, 2.5vh, 1.75rem); }
  h1 { font-size: clamp(1.5rem, 2.4vw, 2.1rem); letter-spacing: -.02em; margin: 0 0 .35rem; }
  header p { margin: 0; color: var(--muted); font-size: clamp(.95rem, 1.1vw, 1.05rem); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .85em; background: var(--accent-soft);
    padding: .1em .4em; border-radius: 5px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: clamp(14px, 1.4vw, 22px);
    box-shadow: var(--shadow);
    padding: clamp(1.25rem, 2.4vw, 2.5rem);
  }

  .uploader {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: clamp(1.25rem, 3vw, 3rem);
    align-items: stretch;
  }
  .zones { display: grid; gap: clamp(1rem, 2vh, 1.75rem); }

  /* --- dropzone --- */
  .zone {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: clamp(190px, 27vh, 320px);
    border: 2px dashed var(--dash);
    border-radius: clamp(12px, 1.1vw, 18px);
    padding: clamp(1.25rem, 2.5vh, 2.25rem) 1.5rem;
    text-align: center;
    transition: background .15s ease, border-color .15s ease;
  }
  .zone.dragging { background: var(--accent-soft); border-color: var(--accent); }
  .zone.filled { border-style: solid; border-color: var(--line); background: #fbfcfe; }
  .zone.invalid { border-color: var(--err); }
  .zone input[type=file] { display: none; }
  .zone .icon {
    color: var(--accent);
    width: clamp(30px, 3vw, 44px); height: clamp(30px, 3vw, 44px);
    margin-bottom: clamp(.5rem, 1.2vh, 1rem);
  }
  .zone h2 { font-size: clamp(1rem, 1.35vw, 1.25rem); margin: 0 0 .2rem; }
  .zone .or { color: var(--faint); font-size: .85rem; margin: .45rem 0; }
  .zone .accepts { color: var(--faint); font-size: .82rem; margin-top: clamp(.6rem, 1.2vh, 1rem); }
  .zone .zone-error { color: var(--err); font-size: .84rem; margin-top: .6rem; max-width: 34ch; }

  .browse {
    font: inherit; font-size: .95rem; font-weight: 600;
    color: var(--accent-fg); background: var(--accent);
    border: 0; border-radius: 999px;
    padding: clamp(.5rem, 1vh, .7rem) clamp(1.4rem, 2.4vw, 2.1rem);
    cursor: pointer; transition: filter .15s ease;
  }
  .browse:hover { filter: brightness(1.06); }

  /* --- file panel --- */
  .panel { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .panel h2 { font-size: clamp(1.05rem, 1.4vw, 1.25rem); margin: 0 0 1rem; }
  /* #files is the flex child, so it has to carry the growth, not .empty. */
  #files { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .empty {
    /* Fills the column so both halves of the card end level. */
    flex: 1 1 auto; min-height: 0; display: grid; place-items: center;
    color: var(--faint); font-size: .9rem;
    border: 1px dashed var(--line); border-radius: 14px;
    padding: 1.5rem; text-align: center;
  }
  .file {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: clamp(.75rem, 1.2vw, 1.1rem);
    padding: clamp(.6rem, 1.2vh, .9rem) 0;
    border-bottom: 1px solid var(--line);
  }
  .file:last-child { border-bottom: 0; }
  .glyph {
    width: clamp(36px, 3vw, 46px); height: clamp(44px, 3.8vw, 58px);
    border-radius: 6px; display: grid; place-items: end center;
    padding-bottom: .4rem; font-size: .6rem; font-weight: 800; letter-spacing: .04em;
    color: #fff; background: var(--json); position: relative;
  }
  .glyph.pdf { background: var(--pdf); }
  .glyph::before {
    content: ""; position: absolute; top: 0; right: 0;
    border-width: 0 11px 11px 0; border-style: solid;
    border-color: transparent rgba(255,255,255,.6) transparent transparent;
    border-radius: 0 6px 0 0;
  }
  .file .name { font-size: .95rem; font-weight: 600; word-break: break-all; }
  .file .meta { color: var(--faint); font-size: .82rem; margin-top: .1rem; }
  .bar { height: 5px; border-radius: 999px; background: var(--line); margin-top: .5rem; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
  .remove {
    border: 0; background: transparent; cursor: pointer; color: var(--faint);
    font-size: 1.4rem; line-height: 1; padding: .25rem .5rem; border-radius: 8px;
  }
  .remove:hover { color: var(--err); background: var(--err-soft); }

  /* --- actions --- */
  .actions {
    display: flex; align-items: center; gap: 1.1rem;
    margin-top: clamp(1.25rem, 2.5vh, 2rem);
    padding-top: clamp(1rem, 2vh, 1.5rem);
    border-top: 1px solid var(--line);
  }
  .submit {
    font: inherit; font-weight: 600; font-size: 1rem;
    color: var(--accent-fg); background: var(--accent);
    border: 0; border-radius: 11px;
    padding: clamp(.6rem, 1.2vh, .8rem) clamp(1.6rem, 3vw, 2.4rem);
    cursor: pointer;
  }
  .submit:disabled { opacity: .4; cursor: not-allowed; }
  #status { color: var(--muted); font-size: .92rem; }

  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    display: inline-block; vertical-align: -2px; margin-right: .5rem;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
    .zone, .browse, .bar > i { transition: none; }
  }

  /* --- results --- */
  .banner {
    margin-top: 1.5rem; border: 1px solid var(--err); background: var(--err-soft);
    color: var(--err); border-radius: 12px; padding: .95rem 1.2rem; font-size: .92rem;
  }
  #summary { margin: clamp(1.5rem, 3vh, 2.25rem) 0 1rem; color: var(--muted); font-size: .9rem; }
  .result { margin-bottom: 1rem; padding: clamp(1.1rem, 1.8vw, 1.6rem); }
  .q { font-weight: 650; font-size: clamp(1rem, 1.15vw, 1.1rem); margin-bottom: .7rem; }
  .tag {
    display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; padding: .2rem .55rem; border-radius: 6px; margin-bottom: .7rem;
  }
  .tag.answered { color: var(--ok); background: var(--ok-soft); }
  .tag.not_found { color: var(--warn); background: var(--warn-soft); }
  .tag.error { color: var(--err); background: var(--err-soft); }
  .a { white-space: pre-wrap; }
  .cites { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: .85rem; }
  .cite { font-size: .86rem; color: var(--muted); margin-bottom: .6rem; }
  .cite:last-child { margin-bottom: 0; }
  .cite .where { color: var(--fg); font-weight: 600; }

  /* Single column once two side-by-side panels would be too narrow to read. */
  @media (max-width: 60rem) {
    .uploader { grid-template-columns: 1fr; }
    body { display: block; }
    main { margin: 0 auto; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>docqa</h1>
    <p>Answers questions using only the document you upload. Unsupported questions return <code>not_found</code>.</p>
  </header>

  <section class="card">
    <div class="uploader">
      <div class="zones">
        <div class="zone" id="zone-document" data-key="document">
          <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <h2>Drag and drop the document</h2>
          <div class="or">or</div>
          <button class="browse" type="button">Browse</button>
          <div class="accepts">Supported files: PDF, JSON</div>
          <div class="zone-error" hidden></div>
          <input type="file" accept=".pdf,.json,application/pdf,application/json" />
        </div>

        <div class="zone" id="zone-questions" data-key="questions">
          <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <h2>Drag and drop the questions</h2>
          <div class="or">or</div>
          <button class="browse" type="button">Browse</button>
          <div class="accepts">Supported files: JSON array of questions</div>
          <div class="zone-error" hidden></div>
          <input type="file" accept=".json,application/json" />
        </div>
      </div>

      <div class="panel">
        <h2>Selected files</h2>
        <div id="files"></div>
      </div>
    </div>

    <div class="actions">
      <button class="submit" id="submit" type="button" disabled>Ask</button>
      <span id="status">Add both files to continue.</span>
    </div>
  </section>

  <div id="error" hidden></div>
  <div id="summary" hidden></div>
  <div id="results"></div>
</main>

<script>
(() => {
  "use strict";

  const ACCEPTS = {
    document: { exts: ["pdf", "json"], label: "a PDF or JSON file" },
    questions: { exts: ["json"], label: "a JSON file" },
  };
  const TITLES = { document: "Document", questions: "Questions" };

  const state = { document: null, questions: null };

  const $ = (id) => document.getElementById(id);
  const filesEl = $("files");
  const submitEl = $("submit");
  const statusEl = $("status");
  const errorEl = $("error");
  const summaryEl = $("summary");
  const resultsEl = $("results");

  const extensionOf = (name) => (name.split(".").pop() || "").toLowerCase();

  const formatSize = (bytes) => {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  };

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  // --- file selection -----------------------------------------------------

  function showZoneError(zone, message) {
    const box = zone.querySelector(".zone-error");
    box.textContent = message;
    box.hidden = !message;
    zone.classList.toggle("invalid", Boolean(message));
  }

  function accept(key, file) {
    const zone = $(`zone-${key}`);
    if (!file) return;

    const ext = extensionOf(file.name);
    if (!ACCEPTS[key].exts.includes(ext)) {
      showZoneError(zone, `That is a .${ext} file. Please choose ${ACCEPTS[key].label}.`);
      return;
    }

    showZoneError(zone, "");
    state[key] = { file, questionCount: null, progress: 0 };
    zone.classList.add("filled");

    // Parse the questions file in the browser so an obvious mistake is caught
    // before an upload, and the count is visible up front.
    if (key === "questions") inspectQuestions(file);
    renderFiles();
  }

  function inspectQuestions(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const list = Array.isArray(parsed)
          ? parsed
          : parsed && (parsed.questions || parsed.items || parsed.data);
        if (Array.isArray(list)) {
          if (state.questions) state.questions.questionCount = list.length;
          showZoneError($("zone-questions"), "");
        } else {
          showZoneError($("zone-questions"),
            'Expected a JSON array, or an object with a "questions" array.');
        }
      } catch (err) {
        showZoneError($("zone-questions"), "That file is not valid JSON.");
      }
      renderFiles();
    };
    reader.readAsText(file);
  }

  function clear(key) {
    state[key] = null;
    const zone = $(`zone-${key}`);
    zone.classList.remove("filled");
    zone.querySelector("input").value = "";
    showZoneError(zone, "");
    renderFiles();
  }

  function renderFiles() {
    filesEl.replaceChildren();
    const keys = Object.keys(state).filter((k) => state[k]);

    if (!keys.length) {
      filesEl.append(el("div", "empty", "Nothing selected yet."));
      updateReady();
      return;
    }

    for (const key of keys) {
      const entry = state[key];
      const ext = extensionOf(entry.file.name);

      const row = el("div", "file");
      row.append(el("div", `glyph ${ext === "pdf" ? "pdf" : ""}`, ext.toUpperCase()));

      const middle = el("div");
      middle.append(el("div", "name", entry.file.name));

      const bits = [TITLES[key], formatSize(entry.file.size)];
      if (entry.questionCount !== null && entry.questionCount !== undefined) {
        bits.push(`${entry.questionCount} question${entry.questionCount === 1 ? "" : "s"}`);
      }
      middle.append(el("div", "meta", bits.join(" · ")));

      const bar = el("div", "bar");
      const fill = el("i");
      fill.style.width = `${entry.progress || 0}%`;
      bar.append(fill);
      bar.hidden = !entry.progress;
      middle.append(bar);
      row.append(middle);

      const remove = el("button", "remove", "×");
      remove.type = "button";
      remove.title = `Remove ${TITLES[key].toLowerCase()}`;
      remove.addEventListener("click", () => clear(key));
      row.append(remove);

      filesEl.append(row);
    }
    updateReady();
  }

  function updateReady() {
    const ready = Boolean(state.document && state.questions);
    submitEl.disabled = !ready;
    if (!submitEl.dataset.busy) {
      statusEl.textContent = ready
        ? "Ready."
        : `Add ${!state.document ? "a document" : "a questions file"} to continue.`;
    }
  }

  function setProgress(percent) {
    for (const key of Object.keys(state)) {
      if (state[key]) state[key].progress = percent;
    }
    renderFiles();
  }

  // --- wiring -------------------------------------------------------------

  for (const key of Object.keys(ACCEPTS)) {
    const zone = $(`zone-${key}`);
    const input = zone.querySelector("input");

    zone.querySelector(".browse").addEventListener("click", () => input.click());
    input.addEventListener("change", () => accept(key, input.files[0]));

    // dragenter/dragover must both be prevented or the browser navigates to
    // the dropped file instead of firing drop.
    for (const type of ["dragenter", "dragover"]) {
      zone.addEventListener(type, (event) => {
        event.preventDefault();
        zone.classList.add("dragging");
      });
    }
    for (const type of ["dragleave", "drop"]) {
      zone.addEventListener(type, () => zone.classList.remove("dragging"));
    }
    zone.addEventListener("drop", (event) => {
      event.preventDefault();
      accept(key, event.dataTransfer.files[0]);
    });
  }

  // Dropping outside a zone would otherwise replace the page with the file.
  for (const type of ["dragover", "drop"]) {
    window.addEventListener(type, (event) => event.preventDefault());
  }

  // --- submission ---------------------------------------------------------

  function showError(message, requestId) {
    document.body.classList.add("has-results");
    errorEl.hidden = false;
    errorEl.className = "banner";
    errorEl.replaceChildren(el("span", null, message));
    if (requestId) {
      errorEl.append(" ", el("code", null, requestId));
    }
  }

  function locator(citation) {
    if (citation.pages && citation.pages.length) {
      const p = citation.pages;
      return p.length === 1 ? `page ${p[0]}` : `pages ${p[0]}–${p[p.length - 1]}`;
    }
    if (citation.json_paths && citation.json_paths.length) return citation.json_paths.join(", ");
    return "document";
  }

  function renderResults(payload) {
    document.body.classList.add("has-results");
    const m = payload.metadata;
    summaryEl.hidden = false;
    summaryEl.textContent = [
      `${m.questions_processed} question${m.questions_processed === 1 ? "" : "s"}`,
      `${m.answered} answered`,
      `${m.not_found} not found`,
      `${m.failed} failed`,
      `${m.chunk_count} chunks`,
      `${Math.round(m.processing_time_ms)} ms`,
      `${m.usage.total_tokens} tokens`,
      `$${m.usage.estimated_cost_usd.toFixed(6)}`,
      m.document_cache_hit ? "cached index" : null,
    ].filter(Boolean).join(" · ");

    resultsEl.replaceChildren();
    for (const result of payload.results) {
      const card = el("div", "card result");
      card.append(el("div", "q", result.question));
      card.append(el("span", `tag ${result.status}`, result.status.replace("_", " ")));
      card.append(el("div", "a", result.answer));

      if (result.citations && result.citations.length) {
        const cites = el("div", "cites");
        for (const citation of result.citations) {
          const item = el("div", "cite");
          item.append(el("span", "where", `${citation.source} — ${locator(citation)}`));
          if (citation.section) item.append(` · ${citation.section}`);
          item.append(document.createElement("br"));
          item.append(citation.snippet);
          cites.append(item);
        }
        card.append(cites);
      }
      resultsEl.append(card);
    }
  }

  // XHR rather than fetch: fetch exposes no upload progress, and a large PDF
  // on a slow link needs to show that something is happening.
  function post(form, onProgress) {
    return new Promise((resolve, reject) => {
      const request = new XMLHttpRequest();
      request.open("POST", "/api/v1/qa");
      request.responseType = "json";
      request.upload.addEventListener("progress", (event) => {
        if (event.lengthComputable) onProgress((event.loaded / event.total) * 100);
      });
      request.addEventListener("load", () =>
        resolve({ status: request.status, body: request.response }));
      request.addEventListener("error", () => reject(new Error("the network request failed")));
      request.addEventListener("timeout", () => reject(new Error("the request timed out")));
      request.send(form);
    });
  }

  submitEl.addEventListener("click", async () => {
    if (!state.document || !state.questions) return;

    errorEl.hidden = true;
    summaryEl.hidden = true;
    resultsEl.replaceChildren();
    submitEl.disabled = true;
    submitEl.dataset.busy = "1";

    const started = performance.now();
    const form = new FormData();
    form.append("document_file", state.document.file);
    form.append("questions_file", state.questions.file);

    statusEl.replaceChildren(el("span", "spinner"), el("span", null, "Uploading…"));

    try {
      const { status, body } = await post(form, (percent) => {
        setProgress(percent);
        if (percent >= 100) {
          statusEl.replaceChildren(el("span", "spinner"), el("span", null, "Answering…"));
        }
      });

      if (status >= 200 && status < 300 && body) {
        renderResults(body);
        statusEl.textContent = `Completed in ${Math.round(performance.now() - started)} ms`;
      } else {
        const message = (body && body.error && body.error.message)
          || `The request failed (HTTP ${status}).`;
        showError(message, body && body.request_id);
        statusEl.textContent = "Failed.";
      }
    } catch (err) {
      showError(`Could not reach the service: ${err.message}`);
      statusEl.textContent = "Failed.";
    } finally {
      setProgress(0);
      delete submitEl.dataset.busy;
      submitEl.disabled = false;
    }
  });

  renderFiles();
})();
</script>
</body>
</html>
